    // Oracle JDBC driver — using the OLDER ojdbc6 (JDBC 4.0, targets Java 6/7/8)
    // instead of ojdbc8: ojdbc8's static initializer references
    // java.sql.DriverAction, a Java 8 class Android's runtime never
    // implemented, which crashes the app with NoClassDefFoundError before a
    // connection is even attempted. ojdbc6 predates that API and doesn't
    // reference it. Excluding its optional wallet/pooling sub-dependencies,
    // which aren't needed for a plain thin connection.
    implementation('com.oracle.database.jdbc:ojdbc6:11.2.0.4') {
        exclude group: 'com.oracle.database.jdbc', module: 'ucp'
        exclude group: 'com.oracle.database.security', module: 'oraclepki'
        exclude group: 'com.oracle.database.security', module: 'osdt_cert'
        exclude group: 'com.oracle.database.security', module: 'osdt_core'
    }
